<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Syntropy Node Archetypes — prototype</title>
<style>
  /* ---- brand fonts (local, relative to prototypes/) ---- */
  @font-face { font-family: "Azeret Mono"; src: url("../math-lab/assets/fonts/azeret-mono-regular.otf") format("opentype"); font-weight: 400; }
  @font-face { font-family: "Fraunces"; src: url("../math-lab/assets/fonts/fraunces-variable.woff2") format("woff2-variations"); font-weight: 300 600; }
  @font-face { font-family: "Roc Grotesk"; src: url("../math-lab/assets/fonts/roc-grotesk-regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Roc Grotesk"; src: url("../math-lab/assets/fonts/roc-grotesk-medium.woff2") format("woff2"); font-weight: 500; }

  :root {
    --bg: #0c0d0f;
    --island: #16181c;
    --well: #0f1115;          /* inputs are always a "well" — darker than the card */
    --border: rgba(255,255,255,0.10);
    --on: #e8e8ea;
    --gray: #8a909a;
    --ease: cubic-bezier(.16,1,.3,1);
    --mono: "Azeret Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--on);
    font-family: "Roc Grotesk", system-ui, sans-serif;
    overflow: hidden;
  }

  /* ---- the infinite canvas ---- */
  #canvas {
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  #wires { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #wires .wire { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 7; animation: flow 1.1s linear infinite; }
  #wires .wire--temp { stroke-dasharray: 5 6; opacity: .85; animation: none; }
  @keyframes flow { to { stroke-dashoffset: -26; } }
  #wires marker path { fill: context-stroke; }

  /* ---- top bar ---- */
  #bar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 50; display: flex; gap: 10px; align-items: center;
    background: rgba(22,24,28,.72); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 16px; backdrop-filter: blur(12px);
    font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--gray); max-width: 92vw;
  }
  #bar b { color: var(--on); font-weight: 600; }
  #bar .sep { width: 1px; height: 16px; background: var(--border); }
  #bar .tag { color: #c99a3c; }

  /* ---- node shell (premium chrome, ported from the house system) ---- */
  .node {
    position: absolute; width: 268px;
    background: var(--island); border: 1px solid var(--border);
    border-radius: 18px; color: var(--on); overflow: hidden;
    display: flex; flex-direction: column; isolation: isolate;
    box-shadow: 0 16px 40px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.04) inset;
    transition: border-color .4s var(--ease), transform .4s var(--ease);
    --accent: #5c939f;
  }
  .node:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .node.dragging { transition: none; box-shadow: 0 24px 60px rgba(0,0,0,.7); z-index: 30; }
  .node::before {
    content: ""; position: absolute; top: -38%; left: -18%; width: 78%; height: 78%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 72%);
    opacity: .14; filter: blur(6px); pointer-events: none; z-index: -1;
  }
  .node::after { /* engine-identity spine */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: var(--accent); opacity: .85; pointer-events: none;
  }
  .crosshair { position: absolute; width: 10px; height: 10px; opacity: .45; pointer-events: none; z-index: 1; }
  .crosshair::before, .crosshair::after { content: ""; position: absolute; background: var(--on); }
  .crosshair::before { left: 4px; top: 0; width: 2px; height: 10px; }
  .crosshair::after  { top: 4px; left: 0; height: 2px; width: 10px; }
  .crosshair.tl { top: 6px; left: 6px; } .crosshair.tr { top: 6px; right: 6px; }
  .crosshair.bl { bottom: 6px; left: 6px; } .crosshair.br { bottom: 6px; right: 6px; }

  .nd-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
    cursor: grab; user-select: none;
  }
  .nd-head:active { cursor: grabbing; }
  .nd-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .nd-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nd-arch { color: var(--gray); font-size: 9px; letter-spacing: .08em; }

  /* portal button — lab fill-sweep in the node's own accent */
  .portal {
    all: unset; pointer-events: auto; cursor: pointer; position: relative; overflow: hidden;
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono);
    font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase;
    color: color-mix(in srgb, var(--accent) 75%, var(--on));
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    transition: color .3s var(--ease), border-color .3s var(--ease), box-shadow .4s var(--ease);
  }
  .portal::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
    background: var(--accent); transform: scaleX(0); transform-origin: left;
    transition: transform .4s var(--ease);
  }
  .portal:hover { color: #090909; border-color: var(--accent); box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 55%, transparent); }
  .portal:hover::before { transform: scaleX(1); }

  .nd-body { padding: 12px; display: flex; flex-direction: column; gap: 9px; }

  /* ---- shared controls ---- */
  .label { font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--gray); font-size: 9px; }
  .well {
    background: var(--well); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; position: relative;
  }
  .field {
    all: unset; width: 100%; box-sizing: border-box; padding: 8px 10px;
    font-family: var(--mono); font-size: 13px; color: var(--on); font-weight: 600;
    pointer-events: auto; cursor: text;
  }
  .field::placeholder { color: var(--gray); font-weight: 400; }
  .well:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 10px 1px color-mix(in srgb, var(--accent) 40%, transparent); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; height: 36px; }
  .num { all: unset; font-family: var(--mono); font-size: 14px; color: var(--on); font-weight: 600; text-align: right; width: 84px; pointer-events: auto; }

  input[type=range] {
    -webkit-appearance: none; appearance: none; height: 3px; background: var(--border); border-radius: 999px; pointer-events: auto;
  }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--accent); cursor: pointer; }

  .seg { display: flex; gap: 4px; }
  .seg button {
    all: unset; pointer-events: auto; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--gray); border: 1px solid transparent;
  }
  .seg button.on { color: var(--on); background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

  .viz { background: var(--well); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .viz canvas { display: block; width: 100%; }

  /* matrix grid editor + factor grids */
  .mgrid { display: grid; gap: 3px; }
  .mcell {
    all: unset; pointer-events: auto; cursor: text; text-align: center;
    background: var(--well); border: 1px solid var(--border); border-radius: 5px;
    font-family: var(--mono); font-size: 11px; color: var(--on); padding: 5px 0; min-width: 0;
  }
  .mcell:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .factorRow { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 4px; }
  .factorCol { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .factorCol .label { font-size: 8px; }
  .equals { font-family: var(--serif); font-size: 20px; color: var(--gray); }

  /* trace table */
  .trace { max-height: 150px; overflow-y: auto; background: var(--well); border: 1px solid var(--border); border-radius: 8px; }
  .trace table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 10.5px; }
  .trace th { position: sticky; top: 0; background: #15171b; color: var(--gray); font-weight: 400; text-transform: uppercase; letter-spacing: .04em; font-size: 8.5px; padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--border); }
  .trace td { padding: 4px 6px; text-align: right; color: var(--on); border-top: 1px solid rgba(255,255,255,.04); }
  .trace tr.now td { color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .trace tr.win td { color: #4f9e82; }

  /* output stat rows */
  .outs { border-top: 1px dashed var(--border); margin-top: 2px; padding-top: 8px; display: grid; gap: 1px; background: var(--well); border-radius: 8px; }
  .outrow { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--island); font-family: var(--mono); font-size: 11px; }
  .outrow .k { color: var(--gray); } .outrow .v { color: var(--accent); font-weight: 600; }

  /* wired input highlight */
  .wired { border-color: var(--accent) !important; background: color-mix(in srgb, var(--accent) 9%, var(--well)); }
  .wired .num, .wired .field { color: var(--accent); cursor: default; }
  .wiremark { color: var(--accent); margin-right: 3px; }

  /* port dots — n8n-style, half in / half out */
  .port {
    position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--island); transform: translateY(-50%);
    z-index: 3; pointer-events: auto;
    box-shadow: 0 0 5px 1px color-mix(in srgb, var(--accent) 65%, transparent);
    transition: box-shadow .2s var(--ease), transform .2s var(--ease);
  }
  .port::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; }
  .port--in  { left: -6px; cursor: crosshair; }
  .port--out { right: -6px; cursor: grab; }
  @media (hover: hover) {
    .port:hover { transform: translateY(-50%) scale(1.3); box-shadow: 0 0 7px 2px var(--accent), 0 0 14px 3px color-mix(in srgb, var(--accent) 55%, transparent); }
  }
  .port--hot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 14px 2px var(--accent); }

  .err { font-family: var(--mono); font-size: 10.5px; color: #ed6d40; }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(22,24,28,.92); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; font-family: var(--mono); font-size: 11px; color: var(--on);
    opacity: 0; transition: opacity .3s var(--ease), transform .3s var(--ease); z-index: 80;
    box-shadow: 0 12px 30px rgba(0,0,0,.5); pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .ac { color: var(--accent); }
</style>
</head>
<body>

<div id="bar">
  <span><b>Syntropy node archetypes</b> — prototype</span>
  <span class="sep"></span>
  <span>inputs &amp; outputs are <span class="tag">functional visuals</span></span>
  <span class="sep"></span>
  <span>drag <b>output ports</b> (right) → <b>input ports</b> (left) to wire</span>
  <span class="sep"></span>
  <span>drag a node by its header</span>
</div>

<div id="canvas"></div>
<svg id="wires" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="diamond" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M4.5 0 L9 4.5 L4.5 9 L0 4.5 Z" />
    </marker>
  </defs>
</svg>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================================
   Syntropy node archetypes — standalone prototype.

   Each node is one visualization archetype. The archetype defines BOTH how its
   inputs are presented as functional visuals (editable matrix grids, draggable
   axis endpoints, sliders that morph a curve live, a draggable point on a field)
   AND how its output is rendered (a filling trace table, a curve with partition
   pieces, A = LU grids, a slope field with a solution curve, a shaded density).
   Wires are dashed beziers with diamond markers, colored by the source node's
   engine accent. The "Open ↗" portal is the lab fill-sweep button — here it
   surfaces where the real method page would open.
   ============================================================================ */

const ACCENTS = {
  numerical: "#5c939f", calculus: "#4f9e82", "linear-algebra": "#8570b3",
  ode: "#4f8fc0", statistics: "#c99a3c", "number-theory": "#a3623c", complex: "#b45fd0"
};

const canvasEl = document.getElementById("canvas");
const wiresSvg = document.getElementById("wires");
const toastEl = document.getElementById("toast");
let toastT = 0;
function toast(msg) {
  toastEl.innerHTML = msg;
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove("show"), 1900);
}

/* ---- tiny expression compiler (prototype only — uses `with` over a Math scope) ---- */
function compile(expr, vars) {
  vars = vars || ["x"];
  const e = String(expr).replace(/\^/g, "**");
  const scope = {};
  for (const k of Object.getOwnPropertyNames(Math)) scope[k] = Math[k];
  scope.e = Math.E; scope.pi = Math.PI;
  try {
    const fn = new Function("scope", "with(scope){ return function(" + vars.join(",") + "){ return (" + e + "); } }");
    const inner = fn(scope);
    return (...vals) => { try { const r = inner(...vals); return (typeof r === "number" && isFinite(r)) ? r : NaN; } catch { return NaN; } };
  } catch { return () => NaN; }
}

/* ---- canvas-pixel helpers for node viz ---- */
function mkCanvas(w, h, cssW) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h; if (cssW) c.style.width = cssW + "px";
  return c;
}
function plotAxes(ctx, w, h, x0, x1, y0, y1) {
  const sx = (x) => ((x - x0) / (x1 - x0)) * (w - 14) + 7;
  const sy = (y) => h - 8 - ((y - y0) / (y1 - y0)) * (h - 16);
  // zero lines
  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1;
  if (y0 < 0 && y1 > 0) { ctx.beginPath(); ctx.moveTo(7, sy(0)); ctx.lineTo(w - 7, sy(0)); ctx.stroke(); }
  if (x0 < 0 && x1 > 0) { ctx.beginPath(); ctx.moveTo(sx(0), 7); ctx.lineTo(sx(0), h - 8); ctx.stroke(); }
  return { sx, sy };
}

/* ============================================================================
   Node model + generic shell
   ============================================================================ */
const NODES = [];
const byId = (id) => NODES.find(n => n.id === id);

function renderShell(n) {
  const el = document.createElement("div");
  el.className = "node"; el.dataset.id = n.id;
  el.style.setProperty("--accent", n.accent);
  el.style.left = n.x + "px"; el.style.top = n.y + "px";
  el.innerHTML =
    '<div class="nd-head">' +
      '<span class="nd-dot"></span>' +
      '<span class="nd-title"></span>' +
      '<span class="nd-arch"></span>' +
      '<button class="portal" type="button">Open ↗</button>' +
    '</div>' +
    '<div class="nd-body"></div>';
  el.querySelector(".nd-title").textContent = n.title;
  el.querySelector(".nd-arch").textContent = n.archLabel;
  el.querySelector(".portal").addEventListener("click", () =>
    toast('Opens <span class="ac">' + n.title + '</span> in the lab ↗<br>(portal pre-fills the page with this node\'s inputs)'));
  n.el = el;
  canvasEl.appendChild(el);
  // drag by header
  const head = el.querySelector(".nd-head");
  head.addEventListener("pointerdown", (e) => startNodeDrag(n, e));
  return el;
}

/* ---- port dots ---- */
function addPort(side, kind, key, label, host) {
  const dot = document.createElement("span");
  dot.className = "port port--" + side;
  dot.style.top = (host.offsetTop + host.offsetHeight / 2) + "px";
  dot.dataset.kind = kind; dot.dataset.key = key;
  return dot;
}

/* ============================================================================
   Wiring
   ============================================================================ */
let wires = []; // { from:{node,key,kind}, to:{node,key,kind} }
let dragWire = null;

function portCenter(nodeId, side, key) {
  const el = byId(nodeId).el;
  const sel = side === "out"
    ? '.port--out[data-key="' + key + '"]'
    : '.port--in[data-key="' + key + '"]';
  const dot = el.querySelector(sel);
  if (!dot) return null;
  const r = dot.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function pathFor(a, b) {
  const dx = Math.max(40, Math.abs(b.x - a.x) * 0.5);
  return "M" + a.x + "," + a.y + " C" + (a.x + dx) + "," + a.y + " " + (b.x - dx) + "," + b.y + " " + b.x + "," + b.y;
}

function redrawWires() {
  // clear paths (keep defs)
  [...wiresSvg.querySelectorAll("path")].forEach(p => p.remove());
  for (const w of wires) {
    const a = portCenter(w.from.node, "out", w.from.key);
    const b = portCenter(w.to.node, "in", w.to.key);
    if (!a || !b) continue;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", pathFor(a, b));
    p.setAttribute("class", "wire");
    p.setAttribute("stroke", byId(w.from.node).accent);
    p.setAttribute("marker-end", "url(#diamond)");
    wiresSvg.appendChild(p);
  }
  if (dragWire) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", pathFor(dragWire.a, dragWire.b));
    p.setAttribute("class", "wire wire--temp");
    p.setAttribute("stroke", dragWire.color);
    wiresSvg.appendChild(p);
  }
}

function startWire(nodeId, key, kind, e) {
  e.preventDefault(); e.stopPropagation();
  const a = portCenter(nodeId, "out", key);
  dragWire = { from: { node: nodeId, key, kind }, a, b: { x: a.x, y: a.y }, color: byId(nodeId).accent };
  const move = (ev) => {
    dragWire.b = { x: ev.clientX, y: ev.clientY };
    // highlight compatible input ports
    document.querySelectorAll(".port--in").forEach(d => {
      d.classList.toggle("port--hot", d.dataset.kind === kind && d.closest(".node").dataset.id !== nodeId);
    });
    redrawWires();
  };
  const up = (ev) => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    document.querySelectorAll(".port--hot").forEach(d => d.classList.remove("port--hot"));
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    const inDot = target && target.closest && target.closest(".port--in");
    if (inDot) {
      const tNode = inDot.closest(".node").dataset.id;
      const tKey = inDot.dataset.key;
      const tKind = inDot.dataset.kind;
      if (tNode !== nodeId && tKind === kind) {
        // replace any existing wire into that input
        wires = wires.filter(w => !(w.to.node === tNode && w.to.key === tKey));
        wires.push({ from: { node: nodeId, key, kind }, to: { node: tNode, key: tKey, kind: tKind } });
        propagate(tNode);
      } else if (tKind !== kind) {
        toast("Type mismatch — <span class='ac'>" + kind + "</span> output can't feed a <span class='ac'>" + tKind + "</span> input");
      }
    }
    dragWire = null;
    redrawWires();
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

/* feed wired values downstream and recompute */
function propagate(nodeId) {
  const n = byId(nodeId);
  if (n.applyWires) n.applyWires();
  if (n.update) n.update();
}

/* ============================================================================
   Archetype 1 — TRACE (Newton–Raphson)  [numerical]
   step table that fills in + trajectory on f(x)
   ============================================================================ */
function buildTrace(body, n) {
  body.innerHTML =
    '<div class="well"><input class="field" id="' + n.id + '-fx" value="x^3 - x - 2" placeholder="f(x)"/></div>' +
    '<div class="row" style="padding:0 10px;"><span class="label">x₀ (first row)</span><input class="num" id="' + n.id + '-x0" type="number" step="0.1" value="1.5"></div>' +
    '<div class="well"><div class="trace"><table><thead><tr><th>n</th><th>xₙ</th><th>f(xₙ)</th><th>err</th></tr></thead><tbody id="' + n.id + '-tb"></tbody></table></div></div>' +
    '<div class="viz" id="' + n.id + '-viz"></div>' +
    '<div class="outs" id="' + n.id + '-outs"></div>';
  const viz = body.querySelector("#" + n.id + "-viz");
  const c = mkCanvas(244, 96); viz.appendChild(c);
  // input port: x0 (number), output port: root (number)
  const x0row = body.querySelector(".row");
  const ip = document.createElement("span"); ip.className = "port port--in"; ip.dataset.kind = "number"; ip.dataset.key = "x0";
  x0row.style.position = "relative"; x0row.appendChild(ip);
  // output row added after compute
  n.fx = "x^3 - x - 2"; n.state = { x0: 1.5, steps: [] };
  body.querySelector("#" + n.id + "-fx").addEventListener("input", (e) => { n.fx = e.target.value; n.update(); });
  body.querySelector("#" + n.id + "-x0").addEventListener("input", (e) => {
    if (!n.wiredKeys.has("x0")) { n.state.x0 = parseFloat(e.target.value) || 0; n.update(); }
  });
  n.update = function () {
    const f = compile(n.fx, ["x"]);
    const df = (x) => (f(x + 1e-5) - f(x - 1e-5)) / 2e-5;
    let x = n.state.x0, steps = [];
    for (let i = 0; i < 40; i++) {
      const fx = f(x), d = df(x);
      if (!isFinite(fx) || !isFinite(d) || Math.abs(d) < 1e-12) break;
      const nx = x - fx / d, err = Math.abs(nx - x);
      steps.push({ i, x, fx, err });
      x = nx;
      if (err < 1e-6) { steps.push({ i: i + 1, x, fx: f(x), err: 0, win: true }); break; }
    }
    n.state.steps = steps;
    // table
    const tb = body.querySelector("#" + n.id + "-tb");
    tb.innerHTML = steps.map((s, i) =>
      '<tr class="' + (s.win ? "win" : (i === steps.length - 1 ? "now" : "")) + '"><td>' + s.i + '</td><td>' + s.x.toPrecision(5) + '</td><td>' + s.fx.toExponential(2) + '</td><td>' + s.err.toExponential(2) + '</td></tr>'
    ).join("");
    tb.parentElement.scrollTop = 1e9;
    // trajectory plot
    const ctx = c.getContext("2d"); ctx.clearRect(0, 0, 244, 96);
    const xs = steps.map(s => s.x);
    let lo = Math.min(...xs, 0.5), hi = Math.max(...xs, 2.5);
    if (!isFinite(lo)) { lo = 0; hi = 3; }
    const pad = (hi - lo) * 0.2 || 1; lo -= pad; hi += pad;
    const fmin = -8, fmax = 8;
    const { sx, sy } = plotAxes(ctx, 244, 96, lo, hi, fmin, fmax);
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let px = 0; px <= 244; px++) {
      const xv = lo + (px / 244) * (hi - lo), yv = f(xv);
      if (!isFinite(yv) || yv < fmin || yv > fmax) continue;
      const X = px, Y = sy(Math.max(fmin + 0.001, Math.min(fmax - 0.001, yv)));
      if (px === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke();
    // iteration dots + stems
    ctx.fillStyle = n.accent;
    steps.forEach((s) => {
      const X = sx(s.x), Y = sy(Math.max(fmin + .01, Math.min(fmax - .01, s.fx)));
      ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X, sy(0)); ctx.lineTo(X, Y); ctx.stroke();
      ctx.beginPath(); ctx.arc(X, Y, 2.6, 0, 7); ctx.fill();
    });
    // outputs
    const root = steps.length ? steps[steps.length - 1].x : NaN;
    n.outputs = { root: { kind: "number", label: "root", value: root }, iters: { kind: "number", label: "iters", value: steps.length } };
    renderOuts(n);
  };
  n.update();
}

/* ============================================================================
   Archetype 2 — REAL-LINE PLOT (Riemann sum)  [calculus]
   curve + partition rectangles + running area; draggable [a,b]; n slider live
   ============================================================================ */
function buildPlot(body, n) {
  body.innerHTML =
    '<div class="well"><input class="field" id="' + n.id + '-fx" value="sin(x)+1" placeholder="f(x)"/></div>' +
    '<div class="viz" id="' + n.id + '-viz"></div>' +
    '<div class="row" style="padding:0 2px;"><span class="label">n</span><input type="range" id="' + n.id + '-n" min="2" max="60" value="12" style="flex:1"></div>' +
    '<div class="seg" id="' + n.id + '-rule"><button data-r="left" class="on">left</button><button data-r="mid">mid</button><button data-r="right">right</button></div>' +
    '<div class="outs" id="' + n.id + '-outs"></div>';
  const viz = body.querySelector("#" + n.id + "-viz");
  const c = mkCanvas(244, 120); viz.appendChild(c);
  n.fx = "sin(x)+1"; n.state = { a: 0, b: 6.28, n: 12, rule: "left" };
  // input port: a (number)
  const fxwell = body.querySelector(".well");
  const ip = document.createElement("span"); ip.className = "port port--in"; ip.dataset.kind = "number"; ip.dataset.key = "a";
  fxwell.style.position = "relative"; fxwell.appendChild(ip);

  body.querySelector("#" + n.id + "-fx").addEventListener("input", (e) => { n.fx = e.target.value; n.update(); });
  body.querySelector("#" + n.id + "-n").addEventListener("input", (e) => { n.state.n = +e.target.value; n.update(); });
  body.querySelectorAll("#" + n.id + "-rule button").forEach(b => b.addEventListener("click", () => {
    body.querySelectorAll("#" + n.id + "-rule button").forEach(x => x.classList.remove("on")); b.classList.add("on");
    n.state.rule = b.dataset.r; n.update();
  }));

  // draggable [a,b] endpoints on the canvas
  let drag = null;
  c.addEventListener("pointerdown", (e) => {
    const r = c.getBoundingClientRect(); const px = e.clientX - r.left;
    const { x0, x1 } = n._view || {};
    if (x0 == null) return;
    const ax = x0 + (px / 244) * (x1 - x0);
    drag = (Math.abs(ax - n.state.a) < Math.abs(ax - n.state.b)) ? "a" : "b";
    c.setPointerCapture(e.pointerId);
  });
  c.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const r = c.getBoundingClientRect(); const px = Math.max(0, Math.min(244, e.clientX - r.left));
    const { x0, x1 } = n._view; const ax = x0 + (px / 244) * (x1 - x0);
    if (drag === "a") n.state.a = Math.min(ax, n.state.b - 0.1); else n.state.b = Math.max(ax, n.state.a + 0.1);
    n.update();
  });
  c.addEventListener("pointerup", () => drag = null);

  n.update = function () {
    const f = compile(n.fx, ["x"]);
    const { a, b, n: N, rule } = n.state;
    if (!(b > a)) return;
    const ctx = c.getContext("2d"); ctx.clearRect(0, 0, 244, 120);
    // sample f for y-range
    let ymin = 1e9, ymax = -1e9;
    const samples = 80;
    for (let i = 0; i <= samples; i++) {
      const xv = a + (i / samples) * (b - a), yv = f(xv);
      if (isFinite(yv)) { ymin = Math.min(ymin, yv); ymax = Math.max(ymax, yv); }
    }
    if (!isFinite(ymin)) { ymin = 0; ymax = 1; }
    const pad = (ymax - ymin) * 0.15 || 1; ymin -= pad; ymax += pad;
    n._view = { x0: a, x1: b };
    const { sx, sy } = plotAxes(ctx, 244, 120, a, b, ymin, ymax);
    // rectangles
    const dx = (b - a) / N; let total = 0;
    ctx.fillStyle = "color-mix(in srgb, " + n.accent + " 22%, transparent)";
    ctx.strokeStyle = n.accent; ctx.lineWidth = 1;
    for (let i = 0; i < N; i++) {
      const xl = a + i * dx;
      const xs = rule === "left" ? xl : rule === "right" ? xl + dx : xl + dx / 2;
      const yv = f(xs); if (!isFinite(yv)) continue;
      total += yv * dx;
      const X = sx(xl), W = sx(xl + dx) - sx(xl);
      const Y = sy(Math.max(0, yv)), H = Math.abs(sy(yv) - sy(0));
      ctx.fillRect(X, Y, Math.max(1, W), H);
      ctx.strokeRect(X, Y, Math.max(1, W), H);
    }
    // curve
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let px = 0; px <= 244; px++) {
      const xv = a + (px / 244) * (b - a), yv = f(xv);
      if (!isFinite(yv)) continue;
      const X = px, Y = sy(yv);
      if (px === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke();
    // endpoint handles
    ctx.fillStyle = n.accent;
    [a, b].forEach(xv => { ctx.beginPath(); ctx.arc(sx(xv), sy(0), 4, 0, 7); ctx.fill(); });
    n.outputs = { total: { kind: "number", label: "∫ ≈", value: total }, n: { kind: "number", label: "n", value: N } };
    renderOuts(n);
  };
  n.update();
}

/* ============================================================================
   Archetype 3 — MATRIX GRID (LU decomposition)  [linear-algebra]
   editable cell grid input; A = L · U output side by side
   ============================================================================ */
function buildMatrix(body, n) {
  body.innerHTML =
    '<div class="label">A — click a cell to edit</div>' +
    '<div class="mgrid" id="' + n.id + '-A"></div>' +
    '<div class="factorRow" id="' + n.id + '-facs"></div>' +
    '<div class="outs" id="' + n.id + '-outs"></div>';
  const A = [[2, 1, 1], [4, -6, 0], [-2, 7, 2]];
  n.state = { A };
  // input port: A (matrix)
  const grid = body.querySelector("#" + n.id + "-A");
  const ip = document.createElement("span"); ip.className = "port port--in"; ip.dataset.kind = "matrix"; ip.dataset.key = "A";
  grid.style.position = "relative"; grid.appendChild(ip);

  function renderGrid(host, M, editable) {
    host.style.gridTemplateColumns = "repeat(" + M[0].length + ", 1fr)";
    host.innerHTML = "";
    for (let i = 0; i < M.length; i++) for (let j = 0; j < M[0].length; j++) {
      const cell = document.createElement("input");
      cell.className = "mcell"; cell.value = +(+M[i][j]).toFixed(3);
      if (editable) cell.addEventListener("input", () => {
        const v = parseFloat(cell.value); if (isFinite(v)) { M[i][j] = v; n.update(); }
      });
      else cell.readOnly = true;
      host.appendChild(cell);
    }
  }
  n._renderGrid = renderGrid;
  // input port anchor: keep it on the grid container (positioned via offset)
  renderGrid(grid, A, true);

  n.update = function () {
    const M = n.state.A.map(r => r.slice());
    const m = M.length;
    let L = Array.from({ length: m }, () => Array(m).fill(0));
    let U = M.map(r => r.slice());
    let swaps = 0; let ok = true;
    for (let k = 0; k < m; k++) {
      // partial pivot
      let piv = k; for (let i = k + 1; i < m; i++) if (Math.abs(U[i][k]) > Math.abs(U[piv][k])) piv = i;
      if (piv !== k) { [U[k], U[piv]] = [U[piv], U[k]]; [L[k], L[piv]] = [L[piv], L[k]]; swaps++; }
      if (Math.abs(U[k][k]) < 1e-12) { ok = false; break; }
      L[k][k] = 1;
      for (let i = k + 1; i < m; i++) {
        const f = U[i][k] / U[k][k]; L[i][k] = f;
        for (let j = k; j < m; j++) U[i][j] -= f * U[k][j];
      }
    }
    // det from U diagonal × sign
    let det = ok ? (swaps % 2 ? -1 : 1) : 0;
    if (ok) for (let i = 0; i < m; i++) det *= U[i][i];
    const facs = body.querySelector("#" + n.id + "-facs");
    facs.innerHTML = "";
    const mk = (label, M2) => {
      const col = document.createElement("div"); col.className = "factorCol";
      const g = document.createElement("div"); g.className = "mgrid"; g.style.position = "relative";
      renderGrid(g, M2.map(r => r.map(v => +v.toFixed(3))), false);
      const l = document.createElement("div"); l.className = "label"; l.textContent = label;
      col.appendChild(g); col.appendChild(l); return col;
    };
    facs.appendChild(mk("L", L));
    const eq = document.createElement("div"); eq.className = "equals"; eq.textContent = "·"; facs.appendChild(eq);
    facs.appendChild(mk("U", U));
    // re-add the input port anchor to the A grid (renderGrid cleared it)
    const ip2 = document.createElement("span"); ip2.className = "port port--in"; ip2.dataset.kind = "matrix"; ip2.dataset.key = "A";
    grid.appendChild(ip2);
    n.outputs = { det: { kind: "number", label: "det(A)", value: det }, swaps: { kind: "number", label: "swaps", value: swaps }, U: { kind: "matrix", label: "U", value: U } };
    renderOuts(n);
  };
  n.update();
}

/* ============================================================================
   Archetype 4 — FIELD (ODE direction field)  [ode]
   slope field + draggable initial point + solution curve (Euler)
   ============================================================================ */
function buildField(body, n) {
  body.innerHTML =
    '<div class="well"><input class="field" id="' + n.id + '-f" value="y - x^2" placeholder="dy/dx = f(x,y)"></div>' +
    '<div class="viz" id="' + n.id + '-viz"></div>' +
    '<div class="label" style="text-align:center">drag the point to re-integrate</div>' +
    '<div class="outs" id="' + n.id + '-outs"></div>';
  const viz = body.querySelector("#" + n.id + "-viz");
  const c = mkCanvas(244, 140); viz.appendChild(c);
  n.f = "y - x^2"; n.state = { p: { x: -2, y: 1 } };
  const fwell = body.querySelector(".well");
  const ip = document.createElement("span"); ip.className = "port port--in"; ip.dataset.kind = "point"; ip.dataset.key = "p0";
  fwell.style.position = "relative"; fwell.appendChild(ip);

  body.querySelector("#" + n.id + "-f").addEventListener("input", (e) => { n.f = e.target.value; n.update(); });
  const VIEW = { x0: -4, x1: 4, y0: -4, y1: 4 };
  n._view = VIEW;
  let dragging = false;
  c.addEventListener("pointerdown", (e) => {
    const r = c.getBoundingClientRect();
    const x = VIEW.x0 + ((e.clientX - r.left) / 244) * (VIEW.x1 - VIEW.x0);
    const y = VIEW.y1 - ((e.clientY - r.top) / 140) * (VIEW.y1 - VIEW.y0);
    n.state.p = { x, y }; dragging = true; c.setPointerCapture(e.pointerId); n.update();
  });
  c.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const r = c.getBoundingClientRect();
    n.state.p = {
      x: VIEW.x0 + Math.max(0, Math.min(244, e.clientX - r.left)) / 244 * (VIEW.x1 - VIEW.x0),
      y: VIEW.y1 - Math.max(0, Math.min(140, e.clientY - r.top)) / 140 * (VIEW.y1 - VIEW.y0)
    };
    n.update();
  });
  c.addEventListener("pointerup", () => dragging = false);

  n.update = function () {
    const f = compile(n.f, ["x", "y"]);
    const ctx = c.getContext("2d"); ctx.clearRect(0, 0, 244, 140);
    const { sx, sy } = plotAxes(ctx, 244, 140, VIEW.x0, VIEW.x1, VIEW.y0, VIEW.y1);
    // slope field
    ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 1;
    for (let i = 1; i < 9; i++) for (let j = 1; j < 7; j++) {
      const xv = VIEW.x0 + (i / 9) * (VIEW.x1 - VIEW.x0), yv = VIEW.y1 - (j / 7) * (VIEW.y1 - VIEW.y0);
      let s = f(xv, yv); if (!isFinite(s)) continue;
      const len = 7, ang = Math.atan2(-s, 1); // screen-y flipped
      const X = sx(xv), Y = sy(yv);
      ctx.beginPath(); ctx.moveTo(X - Math.cos(ang) * len / 2, Y - Math.sin(ang) * len / 2);
      ctx.lineTo(X + Math.cos(ang) * len / 2, Y + Math.sin(ang) * len / 2); ctx.stroke();
    }
    // Euler solution forward + backward
    const traj = [];
    const step = 0.05;
    let x = n.state.p.x, y = n.state.p.y;
    for (let k = 0; k < 200; k++) { traj.push({ x, y }); const s = f(x, y); if (!isFinite(s)) break; y += s * step; x += step; if (x > VIEW.x1) break; }
    x = n.state.p.x - step; y = n.state.p.y - f(n.state.p.x, n.state.p.y) * step;
    const back = [];
    for (let k = 0; k < 200; k++) { back.push({ x, y }); const s = f(x, y); if (!isFinite(s)) break; y -= s * step; x -= step; if (x < VIEW.x0) break; }
    const all = [...back.reverse(), ...traj];
    ctx.strokeStyle = n.accent; ctx.lineWidth = 2;
    ctx.beginPath();
    all.forEach((p, i) => { const X = sx(p.x), Y = sy(p.y); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.stroke();
    // initial point
    ctx.fillStyle = n.accent; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx(n.state.p.x), sy(n.state.p.y), 5, 0, 7); ctx.fill(); ctx.stroke();
    n.outputs = { x0: { kind: "number", label: "x₀", value: n.state.p.x }, y0: { kind: "number", label: "y₀", value: n.state.p.y } };
    renderOuts(n);
  };
  n.update();
}

/* ============================================================================
   Archetype 5 — DISTRIBUTION (Normal)  [statistics]
   sliders morph the curve live; draggable x; shaded P(X ≤ x)
   ============================================================================ */
function buildDist(body, n) {
  body.innerHTML =
    '<div class="row" style="padding:0 2px;"><span class="label">μ</span><input type="range" id="' + n.id + '-mu" min="-3" max="3" step="0.1" value="0" style="flex:1"></div>' +
    '<div class="row" style="padding:0 2px;"><span class="label">σ</span><input type="range" id="' + n.id + '-sd" min="0.3" max="3" step="0.05" value="1" style="flex:1"></div>' +
    '<div class="viz" id="' + n.id + '-viz"></div>' +
    '<div class="seg" id="' + n.id + '-tail"><button data-t="lt" class="on">P(X ≤ x)</button><button data-t="gt">P(X ≥ x)</button></div>' +
    '<div class="outs" id="' + n.id + '-outs"></div>';
  const viz = body.querySelector("#" + n.id + "-viz");
  const c = mkCanvas(244, 110); viz.appendChild(c);
  n.state = { mu: 0, sd: 1, x: 1, tail: "lt" };
  const muR = body.querySelector("#" + n.id + "-mu"), sdR = body.querySelector("#" + n.id + "-sd");
  muR.addEventListener("input", () => { n.state.mu = +muR.value; n.update(); });
  sdR.addEventListener("input", () => { n.state.sd = +sdR.value; n.update(); });
  body.querySelectorAll("#" + n.id + "-tail button").forEach(b => b.addEventListener("click", () => {
    body.querySelectorAll("#" + n.id + "-tail button").forEach(x => x.classList.remove("on")); b.classList.add("on");
    n.state.tail = b.dataset.t; n.update();
  }));
  const VIEW = { x0: -6, x1: 6 };
  let dragging = false;
  c.addEventListener("pointerdown", (e) => { dragging = true; c.setPointerCapture(e.pointerId); moveX(e); });
  c.addEventListener("pointermove", (e) => { if (dragging) moveX(e); });
  c.addEventListener("pointerup", () => dragging = false);
  function moveX(e) {
    const r = c.getBoundingClientRect();
    n.state.x = VIEW.x0 + Math.max(0, Math.min(244, e.clientX - r.left)) / 244 * (VIEW.x1 - VIEW.x0);
    n.update();
  }
  n.update = function () {
    const { mu, sd, x, tail } = n.state;
    const pdf = (xv) => Math.exp(-((xv - mu) ** 2) / (2 * sd * sd)) / (sd * Math.sqrt(2 * Math.PI));
    const cdf = (xv) => 0.5 * (1 + erf((xv - mu) / (sd * Math.SQRT2)));
    const ctx = c.getContext("2d"); ctx.clearRect(0, 0, 244, 110);
    const ymax = pdf(mu) * 1.15;
    const { sx, sy } = plotAxes(ctx, 244, 110, VIEW.x0, VIEW.x1, 0, ymax);
    // shaded region
    ctx.fillStyle = "color-mix(in srgb, " + n.accent + " 26%, transparent)";
    ctx.beginPath(); ctx.moveTo(sx(VIEW.x0), sy(0));
    const lo = tail === "lt" ? VIEW.x0 : x, hi = tail === "lt" ? x : VIEW.x1;
    for (let xv = lo; xv <= hi; xv += 0.05) ctx.lineTo(sx(xv), sy(pdf(xv)));
    ctx.lineTo(sx(hi), sy(0)); ctx.closePath(); ctx.fill();
    // curve
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let px = 0; px <= 244; px++) { const xv = VIEW.x0 + (px / 244) * (VIEW.x1 - VIEW.x0); ctx.lineTo(px, sy(pdf(xv))); }
    ctx.stroke();
    // x marker
    ctx.strokeStyle = n.accent; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx(x), sy(0)); ctx.lineTo(sx(x), sy(pdf(x))); ctx.stroke();
    ctx.fillStyle = n.accent; ctx.beginPath(); ctx.arc(sx(x), sy(pdf(x)), 3.5, 0, 7); ctx.fill();
    const p = tail === "lt" ? cdf(x) : 1 - cdf(x);
    n.outputs = { p: { kind: "number", label: tail === "lt" ? "P(X ≤ x)" : "P(X ≥ x)", value: p }, x: { kind: "number", label: "x", value: x } };
    renderOuts(n);
  };
  n.update();
}
function erf(x) { // Abramowitz & Stegun 7.1.26
  const t = 1 / (1 + 0.47047 * Math.abs(x));
  const y = 1 - (((((0.7478556 * t - 0.0958798) * t) + 0.3487068) * t) * Math.exp(-x * x));
  return x >= 0 ? y : -y;
}

/* ============================================================================
   Archetype 6 — SCALAR (constant source)  [number-theory]
   a compact node that holds/outputs one number — the wiring source, and the
   archetype for methods whose genuine product is a single value (gcd, det, p).
   ============================================================================ */
function buildScalar(body, n) {
  body.innerHTML =
    '<div class="well"><input class="field" id="' + n.id + '-v" value="1.5" style="text-align:center"></div>' +
    '<div class="label" style="text-align:center;opacity:.7">feeds a number input downstream</div>';
  n.state = { v: 1.5 };
  body.querySelector("#" + n.id + "-v").addEventListener("input", (e) => {
    n.state.v = parseFloat(e.target.value) || 0; n.update();
  });
  n.update = function () {
    n.outputs = { v: { kind: "number", label: "value", value: n.state.v } };
    renderOuts(n);
  };
  n.update();
}

/* ============================================================================
   Output rows + output ports (rendered after each compute)
   ============================================================================ */
function renderOuts(n) {
  const host = n.el.querySelector("#" + n.id + "-outs");
  if (!host) return;
  const outs = Object.entries(n.outputs || {});
  host.innerHTML = outs.map(([k, o]) =>
    '<div class="outrow"><span class="k">' + o.label + '</span><span class="v">' +
    (o.kind === "number" ? (+o.value).toPrecision(5) : (o.kind === "matrix" ? "[" + o.value.length + "×" + o.value[0].length + "]" : String(o.value))) +
    '</span></div>'
  ).join("");
  // (re)attach output ports — one per number/matrix output, on the right edge of each row
  host.querySelectorAll(".outrow").forEach((row, i) => {
    const o = outs[i][1];
    if (o.kind === "number" || o.kind === "matrix") {
      row.style.position = "relative";
      const dot = document.createElement("span");
      dot.className = "port port--out";
      dot.dataset.kind = o.kind; dot.dataset.key = outs[i][0];
      dot.addEventListener("pointerdown", (e) => startWire(n.id, outs[i][0], o.kind, e));
      row.appendChild(dot);
    }
  });
  redrawWires();
}

/* ============================================================================
   Wired inputs — apply upstream values to a node's inputs
   ============================================================================ */
function applyWiresFor(n) {
  n.wiredKeys = n.wiredKeys || new Set();
  for (const w of wires) {
    if (w.to.node !== n.id) continue;
    const src = byId(w.from.node);
    const val = src.outputs && src.outputs[w.from.key] ? src.outputs[w.from.key].value : undefined;
    if (val === undefined) continue;
    // set into the node's state + UI
    if (w.to.key === "x0" && n.id === "newton") { n.state.x0 = val; n.wiredKeys.add("x0"); markWired(n, "x0", val); }
    else if (w.to.key === "a" && n.id === "riemann") { n.state.a = val; n.wiredKeys.add("a"); markWired(n, "a", val); }
  }
}
function markWired(n, key, val) {
  const num = n.el.querySelector("#" + n.id + "-" + key);
  if (num) { num.value = val; num.classList.add("wired"); num.readOnly = true; num.disabled = true; }
}

/* ============================================================================
   Node drag (move on canvas; wires follow)
   ============================================================================ */
function startNodeDrag(n, e) {
  if (e.target.closest(".portal") || e.target.closest(".port") || e.target.closest("input") || e.target.closest("button") || e.target.closest("canvas")) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
  n.el.classList.add("dragging");
  const move = (ev) => {
    n.x = ox + ev.clientX - sx; n.y = oy + ev.clientY - sy;
    n.el.style.left = n.x + "px"; n.el.style.top = n.y + "px";
    redrawWires();
  };
  const up = () => {
    n.el.classList.remove("dragging");
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    redrawWires();
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

/* ============================================================================
   Build the board
   ============================================================================ */
const defs = [
  { id: "newton", arch: "trace", archLabel: "trace", title: "Newton–Raphson", engine: "numerical", x: 60, y: 120 },
  { id: "riemann", arch: "plot", archLabel: "real-line plot", title: "Riemann Sum", engine: "calculus", x: 380, y: 120 },
  { id: "lu", arch: "matrix", archLabel: "matrix grid", title: "LU Decomposition", engine: "linear-algebra", x: 700, y: 120 },
  { id: "ode", arch: "field", archLabel: "field", title: "Direction Field", engine: "ode", x: 60, y: 470 },
  { id: "normal", arch: "dist", archLabel: "distribution", title: "Normal Distribution", engine: "statistics", x: 380, y: 470 },
  { id: "const", arch: "scalar", archLabel: "scalar", title: "Constant", engine: "number-theory", x: 700, y: 470 }
];
const builders = { trace: buildTrace, plot: buildPlot, matrix: buildMatrix, field: buildField, dist: buildDist, scalar: buildScalar };

defs.forEach(d => {
  const n = Object.assign({}, d, { accent: ACCENTS[d.engine], wiredKeys: new Set(), outputs: {} });
  n.applyWires = () => applyWiresFor(n);
  renderShell(n);
  builders[d.arch](n.el.querySelector(".nd-body"), n);
  n.update();
  NODES.push(n);
});

// pre-wire: Constant(1.5) → Newton.x0, and Constant → Riemann.a
wires.push({ from: { node: "const", key: "v", kind: "number" }, to: { node: "newton", key: "x0", kind: "number" } });
wires.push({ from: { node: "const", key: "v", kind: "number" }, to: { node: "riemann", key: "a", kind: "number" } });
byId("newton").applyWires(); byId("newton").update();
byId("riemann").applyWires(); byId("riemann").update();

requestAnimationFrame(redrawWires);
window.addEventListener("resize", redrawWires);
</script>
</body>
