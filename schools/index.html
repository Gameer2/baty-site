<style>
  .hub-shell{ max-width:1120px; margin:0 auto; padding:44px 28px 100px; }
  .hub-back{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:12px; color:var(--pulse-ash); text-decoration:none; margin-bottom:28px; }
  .hub-back:hover{ color:var(--electric-teal); }

  .hub-head{ margin-bottom:56px; }
  .hub-title{ font-family:var(--serif); font-weight:600; font-size:clamp(42px,6.4vw,76px); margin:16px 0 18px; letter-spacing:-.02em; line-height:.98; text-wrap:balance; }
  .hub-title.ar-display{ font-weight:700; }
  .hub-sub{ color:var(--neural-fog); font-size:15px; max-width:60ch; line-height:1.6; }
  .hub-sub b{ color:var(--off-white); font-weight:600; }

  /* ---------------- the shelf: real 3D standing books ---------------- */
  .shelf-wrap{ position:relative; padding-bottom:60px; margin-top:52px; }
  .shelf{ display:flex; align-items:flex-end; gap:34px; flex-wrap:wrap; perspective:2200px; padding:20px 6px 0; }
  [dir="rtl"] .shelf{ flex-direction:row-reverse; }
  .shelf.dim .book:not(:hover){ opacity:.42; filter:saturate(.6); }

  .book{ position:relative; display:block; text-decoration:none; color:inherit; cursor:pointer;
    width:172px; height:252px; transform-style:preserve-3d;
    animation:bookIn .7s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i) * 90ms);
    transition:opacity .35s ease, filter .35s ease; }
  @keyframes bookIn{ from{ opacity:0; transform:translateY(28px) rotateY(0deg); } to{ opacity:1; transform:translateY(0) rotateY(var(--rot)); } }

  .book-obj{ position:absolute; inset:0; transform-style:preserve-3d; transform:rotateY(var(--rot));
    transition:transform .5s cubic-bezier(.2,1.4,.4,1); }
  .book:hover .book-obj, .book:focus-visible .book-obj{ transform:rotateY(0deg) translateZ(30px) translateY(-14px); }
  .book:active .book-obj{ transform:rotateY(0deg) translateZ(24px) translateY(-8px) scale(.985); }

  .face{ position:absolute; top:0; backface-visibility:hidden; border-radius:3px 8px 8px 3px; }
  .face-cover{ left:0; width:172px; height:252px; transform:translateZ(17px);
    background:radial-gradient(120% 90% at 82% 4%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 60%),
      linear-gradient(155deg, var(--rich-carbon), #050505);
    border:1px solid rgba(255,255,255,.08); border-left:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset -1px 0 0 rgba(255,255,255,.04);
    padding:18px 16px 16px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; }
  .cover-motif{ position:absolute; top:14px; right:12px; width:60px; height:60px; opacity:.85; pointer-events:none; }
  .cover-badge{ position:absolute; top:14px; left:14px; width:26px; height:26px; border-radius:50%; border:1.5px solid; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; font-weight:700; direction:ltr; }
  .cover-top{ position:relative; z-index:2; display:flex; flex-direction:column; gap:6px; max-width:78%; margin-top:30px; }
  .cover-eyebrow{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--accent); }
  .cover-title{ font-family:var(--serif); font-weight:600; font-size:24px; letter-spacing:-.01em; line-height:1.05; }
  .cover-title.ar-display{ font-weight:700; }
  .cover-bottom{ position:relative; z-index:2; display:flex; flex-direction:column; gap:10px; }
  .cover-stats{ font-family:var(--mono); font-size:9px; color:var(--pulse-ash); }
  .cover-open{ display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
    font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--core-black); background:var(--accent); padding:6px 6px 6px 12px; border-radius:100px;
    opacity:0; transform:translateY(4px); transition:opacity .3s ease, transform .3s ease; }
  [dir="rtl"] .cover-open{ padding:6px 12px 6px 6px; }
  .book:hover .cover-open{ opacity:1; transform:translateY(0); }

  .face-spine{ left:0; width:34px; height:252px; transform-origin:left center; transform:rotateY(-90deg);
    background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 82%, white 6%), color-mix(in srgb, var(--accent) 70%, black 18%));
    display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 14px rgba(0,0,0,.35); }
  .spine-copy{ writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:rgba(9,9,9,.72); white-space:nowrap; }

  [dir="rtl"] .cover-eyebrow, [dir="rtl"] .cover-stats, [dir="rtl"] .spine-copy, [dir="rtl"] .sem-badge{
    font-family:"Vazirmatn", sans-serif; letter-spacing:0;
  }

  .book-shadow{ position:absolute; left:8px; right:8px; bottom:-22px; height:22px; z-index:-1;
    background:radial-gradient(50% 100% at 50% 0%, rgba(0,0,0,.55), transparent 72%);
    transform:scaleX(.86); transition:transform .5s cubic-bezier(.2,1.4,.4,1), opacity .5s ease; opacity:.8; }
  .book:hover .book-shadow{ transform:scaleX(1.05); opacity:.5; }

  .shelf-ledge{ position:absolute; left:-28px; right:-28px; bottom:0; height:2px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.14) 12%, rgba(255,255,255,.14) 88%, transparent); }

  @media (max-width:640px){
    .shelf{ gap:20px; justify-content:center; }
    .book, .face-cover{ width:138px; height:202px; }
    .face-spine{ height:202px; }
  }

  @media (prefers-reduced-motion: reduce){ .book, .book-obj, .book-shadow{ animation:none !important; transition:none !important; } }
</style>

            </span>
          </span>
        </span>
        <span class="book-shadow"></span>
      </a>
      <a class="book" role="button" tabindex="0" data-book="g6s2" style="--accent:#ed6d40; --accent2:#59a993; --rot:14deg; --i:3;">
        <span class="book-obj">
          <span class="face face-spine">
            <span class="spine-copy" data-i18n-spine="g6s2"></span>
          </span>
          <span class="face face-cover">
            <span class="cover-motif"><svg viewBox="0 0 72 72">
          <circle cx="36" cy="36" r="29" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
          <path d="M36 36 L36 7 A29 29 0 0 1 61 50 Z" fill="#ed6d40" opacity=".92"/>
          <path d="M36 36 L61 50 A29 29 0 0 1 16 61 Z" fill="#59a993" opacity=".85"/>
          <path d="M36 36 L16 61 A29 29 0 0 1 36 7 Z" fill="rgba(255,255,255,.1)"/>
        </svg></span>
            <span class="cover-badge" style="border-color:#ed6d40; color:#ed6d40;">6</span>
            <span class="cover-top">
              <span class="cover-eyebrow" data-i18n-sub="g6s2"></span>
              <span class="cover-title" data-i18n-title="g6s2"></span>
            </span>
            <span class="cover-bottom">
              <span class="cover-stats" data-i18n-stats="g6s2"></span>
              <span class="cover-open" data-i18n-open></span>
            </span>
          </span>
        </span>
        <span class="book-shadow"></span>
      </a>
    </div>

  </div>
</div>

<script>
  var BOOK_I18N = {"g5s1": {"en": {"spine": "GRADE 5 &middot; SEM 1", "sub": "SEMESTER 1", "title": "Mathematics", "stats": "5 units &middot; 25 lessons", "sem": "Grade 5 &middot; Semester 1"}, "ar": {"spine": "الصف الخامس &middot; ف١", "sub": "الفصل الدراسي الأول", "title": "الرياضيات", "stats": "٥ وحدات &middot; ٢٥ درسًا", "sem": "الصف الخامس &middot; الفصل الدراسي الأول"}}, "g5s2": {"en": {"spine": "GRADE 5 &middot; SEM 2", "sub": "SEMESTER 2", "title": "Mathematics", "stats": "5 units &middot; 27 lessons", "sem": "Grade 5 &middot; Semester 2"}, "ar": {"spine": "الصف الخامس &middot; ف٢", "sub": "الفصل الدراسي الثاني", "title": "الرياضيات", "stats": "٥ وحدات &middot; ٢٧ درسًا", "sem": "الصف الخامس &middot; الفصل الدراسي الثاني"}}, "g6s1": {"en": {"spine": "GRADE 6 &middot; SEM 1", "sub": "SEMESTER 1", "title": "Mathematics", "stats": "4 units &middot; 18 lessons", "sem": "Grade 6 &middot; Semester 1"}, "ar": {"spine": "الصف السادس &middot; ف١", "sub": "الفصل الدراسي الأول", "title": "الرياضيات", "stats": "٤ وحدات &middot; ١٨ درسًا", "sem": "الصف السادس &middot; الفصل الدراسي الأول"}}, "g6s2": {"en": {"spine": "GRADE 6 &middot; SEM 2", "sub": "SEMESTER 2", "title": "Mathematics", "stats": "4 units &middot; 21 lessons", "sem": "Grade 6 &middot; Semester 2"}, "ar": {"spine": "الصف السادس &middot; ف٢", "sub": "الفصل الدراسي الثاني", "title": "الرياضيات", "stats": "٤ وحدات &middot; ٢١ درسًا", "sem": "الصف السادس &middot; الفصل الدراسي الثاني"}}};

  var { initI18n } = LessonShell;

  var T = {
    en: {
      backLink: "back to the lab",
      crumb: "JORDAN NATIONAL CURRICULUM · K-12",
      hubTitle: "Pick a book.",
      hubSub: "Two grades, four semesters, each one its own volume. <b>91 lessons</b> inside, every lesson still its own bespoke, interactive page.",
      openWord: "Open"
    },
    ar: {
      backLink: "العودة إلى المختبر",
      crumb: "المنهاج الوطني الأردني · التعليم العام",
      hubTitle: "اختر كتابًا.",
      hubSub: "صفّان، أربعة فصول دراسية، كلٌّ منها مجلّده الخاص. <b>91 درسًا</b> بداخلها، وكل درس صفحته التفاعلية الخاصة.",
      openWord: "افتح"
    }
  };

  var shelf = document.getElementById("shelf");
  var books = shelf.querySelectorAll(".book");

  var hubSubEl = document.getElementById("hubSub");

  function renderBooks(lang) {
    hubSubEl.innerHTML = T[lang].hubSub;
    books.forEach(function (b) {
      var id = b.dataset.book;
      var d = BOOK_I18N[id][lang];
      b.querySelector("[data-i18n-spine]").innerHTML = d.spine;
      b.querySelector("[data-i18n-sub]").innerHTML = d.sub;
      var titleEl = b.querySelector("[data-i18n-title]");
      titleEl.innerHTML = d.title;
      titleEl.classList.toggle("ar-display", lang === "ar");
      b.querySelector("[data-i18n-stats]").innerHTML = d.stats;
      b.querySelector("[data-i18n-open]").innerHTML = T[lang].openWord + " →";
    });
  }

  var FIRST_LESSON = {
    g5s1: "grade-5/1-1-place-value-millions.html",
    g5s2: "grade-5/6-1-thousandths.html",
    g6s1: "grade-6/1-1-integers-absolute-value.html",
    g6s2: "grade-6/5-1-powers-exponents.html"
  };

  function openBook(b) {
    var href = FIRST_LESSON[b.dataset.book];
    if (href) window.location.href = href;
  }

  books.forEach(function (b) {
    b.addEventListener("mouseenter", function () { shelf.classList.add("dim"); });
    b.addEventListener("mouseleave", function () { shelf.classList.remove("dim"); });
    // fires on press, not release: the hover-lift transform can carry the book out from
    // under a fixed pointer coordinate by the time a "click" (press+release) would resolve
    b.addEventListener("pointerdown", function () { openBook(b); });
    b.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openBook(b); }
    });
  });

  var i18n = initI18n(T, { onLangChange: renderBooks });
  renderBooks(i18n.lang);
</script>
</body>
</html>
